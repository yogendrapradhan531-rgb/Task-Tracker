<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header><h1>Task Tracker</h1><button id="theme" class="ghost">Dark / Light</button></header>

    <section id="auth-section">
      <form id="auth-form" class="card">
        <input type="text" id="username" placeholder="Username" hidden />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password (min 6 characters)" required />
        <button type="submit" id="auth-submit">Login</button>
        <a href="#" id="toggle-auth">Need an account? Register</a>
      </form>
    </section>

    <section id="task-section" hidden>
      <div class="user-bar">
        <span id="welcome"></span>
        <span><button id="profile" class="ghost">Profile</button> <button id="logout" class="danger">Logout</button></span>
      </div>

      <div id="stats" class="stats"></div>
      <div id="charts" class="charts"></div>

      <form id="task-form" class="card">
        <input type="text" id="title" placeholder="Task title" required />
        <textarea id="description" placeholder="Description (optional)"></textarea>
        <div class="row">
          <select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
          <select id="project"></select>
          <input type="date" id="dueDate" />
        </div>
        <input type="text" id="tags" placeholder="Tags (comma separated)" />
        <button type="submit">Add Task</button>
      </form>

      <div class="card filters">
        <input type="search" id="f-search" placeholder="Search tasks..." />
        <select id="f-status"><option value="">All status</option><option value="pending">Pending</option><option value="in-progress">In progress</option><option value="completed">Completed</option></select>
        <select id="f-priority"><option value="">All priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
        <select id="f-project"></select>
        <select id="f-sort"><option value="createdAt">Newest</option><option value="dueDate">Due date</option><option value="title">Title</option></select>
        <button id="new-project" class="ghost">+ Project</button>
        <button id="del-project" class="ghost" hidden>Delete project</button>
        <button id="view" class="ghost">Board view</button>
      </div>

      <div id="bulk" class="card bulk" hidden>
        <span id="sel-count"></span>
        <button id="bulk-done">Complete selected</button>
        <button id="bulk-del" class="danger">Delete selected</button>
      </div>

      <ul id="task-list"></ul>
      <div id="board" class="board" hidden></div>
    </section>

    <p id="message"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
